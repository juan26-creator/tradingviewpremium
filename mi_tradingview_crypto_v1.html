<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi TradingView — Crypto Terminal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0e11;color:#d9dee7;font-family:Inter,Arial,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}.top{height:54px;border-bottom:1px solid #252a31;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#101419}
.brand{font-weight:800;color:#fff;margin-right:10px}.select,.btn,input{background:#171c22;color:#dce2ea;border:1px solid #303640;border-radius:5px;padding:8px 10px}.btn{cursor:pointer}.btn:hover{background:#20262e}
.search{width:230px}.layout{display:flex;flex:1;min-height:0}.side{width:270px;border-right:1px solid #252a31;background:#0f1318;display:flex;flex-direction:column}.side h3{font-size:12px;color:#8f98a5;padding:12px;margin:0;border-bottom:1px solid #252a31}.coins{overflow:auto}.coin{padding:9px 12px;border-bottom:1px solid #1d2229;cursor:pointer;display:flex;justify-content:space-between}.coin:hover,.coin.active{background:#1a2027}.coin small{display:block;color:#7e8794}.main{flex:1;min-width:0;display:flex;flex-direction:column}.toolbar{height:43px;border-bottom:1px solid #252a31;display:flex;align-items:center;gap:5px;padding:5px 8px;overflow:auto}.toolbar button{background:transparent;color:#aeb6c2;border:0;padding:7px;cursor:pointer}.toolbar button:hover{color:#fff;background:#1b2128}.chartwrap{flex:1;min-height:0;position:relative}.status{position:absolute;z-index:5;left:12px;top:8px;font-size:12px;color:#8f98a5;background:#0b0e11cc;padding:5px 7px;border-radius:4px}.bottom{height:34px;border-top:1px solid #252a31;display:flex;align-items:center;padding:0 10px;color:#8f98a5;font-size:11px;gap:18px}.green{color:#31d17c}.red{color:#f05b67}.empty{padding:18px;color:#78818e;font-size:13px}.panel{position:absolute;right:12px;top:48px;z-index:8;width:260px;background:#11161c;border:1px solid #303640;border-radius:6px;padding:10px;display:none;box-shadow:0 10px 30px #0008}.panel.show{display:block}.panel h4{margin:4px 0 10px}.row{display:flex;gap:6px;margin:6px 0}.row>*{flex:1}
</style>
</head>
<body>
<div class="top">
  <div class="brand">MY TRADINGVIEW</div>
  <select id="exchange" class="select"><option value="binance">Binance Spot</option><option value="bybit">Bybit Spot</option></select>
  <input id="search" class="select search" placeholder="Buscar criptomoneda...">
  <select id="interval" class="select">
    <option value="1m">1m</option><option value="5m">5m</option><option value="15m" selected>15m</option>
    <option value="30m">30m</option><option value="1h">1h</option><option value="4h">4h</option><option value="1d">1D</option>
  </select>
  <button class="btn" id="indBtn">Indicadores</button>
  <button class="btn" id="reload">↻</button>
</div>
<div class="layout">
  <aside class="side"><h3>CRIPTOACTIVOS DISPONIBLES EN EL EXCHANGE</h3><div id="coins" class="coins"><div class="empty">Cargando mercados...</div></div></aside>
  <main class="main">
    <div class="toolbar">
      <button onclick="alert('Herramienta de línea: versión inicial preparada para expansión')">╱ Línea</button>
      <button onclick="alert('Soporte de dibujo preparado para expansión')">▭ Rectángulo</button>
      <button onclick="alert('Fibonacci: módulo preparado para expansión')">Fib</button>
      <button onclick="alert('Más herramientas de dibujo se añadirán en la siguiente versión')">⋯ Más</button>
    </div>
    <div id="chart" class="chartwrap"><div id="status" class="status">Conectando...</div></div>
    <div class="bottom"><span id="market">—</span><span id="price">—</span><span id="connection">● conexión</span><span>Datos públicos en tiempo real</span></div>
  </main>
</div>
<div id="panel" class="panel">
<h4>Indicadores</h4>
<div class="row"><select id="indicator"><option value="none">Sin indicador</option><option value="ema">EMA 20</option><option value="sma">SMA 20</option><option value="rsi">RSI 14</option></select></div>
<div style="font-size:11px;color:#7f8996">Esta V1 usa datos reales y deja la arquitectura lista para ampliar el motor de indicadores.</div>
</div>

<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'),{
  layout:{background:{type:'solid',color:'#0b0e11'},textColor:'#aeb6c2'},
  grid:{vertLines:{color:'#171c22'},horzLines:{color:'#171c22'}},
  rightPriceScale:{borderColor:'#2a3038'},timeScale:{borderColor:'#2a3038',timeVisible:true,secondsVisible:false},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal}
});
const candles=chart.addSeries(LightweightCharts.CandlestickSeries,{
 upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'
});
const volume=chart.addSeries(LightweightCharts.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'volume'});
volume.priceScale().applyOptions({scaleMargins:{top:.82,bottom:0}});
let emaSeries=null,smaSeries=null,ws=null,current='BTCUSDT',interval='15m',allSymbols=[],filtered=[];
const $=id=>document.getElementById(id);

function setStatus(t){$('status').textContent=t}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

async function loadSymbols(){
  const ex=$('exchange').value;
  try{
    if(ex==='binance'){
      const r=await fetch('https://api.binance.com/api/v3/exchangeInfo');
      const j=await r.json();
      allSymbols=j.symbols.filter(x=>x.status==='TRADING' && x.isSpotTradingAllowed && x.quoteAsset==='USDT')
        .map(x=>({symbol:x.symbol,base:x.baseAsset,quote:x.quoteAsset}));
    }else{
      const r=await fetch('https://api.bybit.com/v5/market/instruments-info?category=spot');
      const j=await r.json();
      allSymbols=(j.result?.list||[]).filter(x=>x.status==='Trading'&&x.quoteCoin==='USDT')
        .map(x=>({symbol:x.symbol,base:x.baseCoin,quote:x.quoteCoin}));
    }
    allSymbols.sort((a,b)=>a.symbol.localeCompare(b.symbol));
    renderSymbols(); connect();
  }catch(e){setStatus('No se pudo cargar la lista de mercados');$('coins').innerHTML='<div class="empty">Error de conexión.</div>'}
}
function renderSymbols(){
  const q=$('search').value.trim().toUpperCase();
  filtered=allSymbols.filter(x=>!q||x.symbol.includes(q)||x.base.includes(q)).slice(0,1500);
  $('coins').innerHTML=filtered.map(x=>`<div class="coin ${x.symbol===current?'active':''}" data-s="${esc(x.symbol)}"><span><b>${esc(x.base)}</b><small>${esc(x.symbol)}</small></span><span>USDT</span></div>`).join('');
  document.querySelectorAll('.coin').forEach(el=>el.onclick=()=>{current=el.dataset.s;renderSymbols();connect()});
}
async function history(){
  const ex=$('exchange').value;
  try{
    let data=[];
    if(ex==='binance'){
      const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${current}&interval=${interval}&limit=1000`);
      data=await r.json();
    }else{
      const r=await fetch(`https://api.bybit.com/v5/market/kline?category=spot&symbol=${current}&interval=${mapBybit(interval)}&limit=1000`);
      const j=await r.json(); data=(j.result?.list||[]).reverse();
    }
    const c=[],v=[];
    data.forEach(k=>{
      if(ex==='binance'){
        c.push({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4]});
        v.push({time:k[0]/1000,value:+k[5],color:+k[4]>=+k[1]?'#26a69a':'#ef5350'});
      }else{
        c.push({time:+k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4]});
        v.push({time:+k[0]/1000,value:+k[5],color:+k[4]>=+k[1]?'#26a69a':'#ef5350'});
      }
    });
    candles.setData(c);volume.setData(v);chart.timeScale().fitContent();setStatus(`${$('exchange').value.toUpperCase()} · ${current} · ${interval}`);
    updateIndicators(c);
  }catch(e){setStatus('Error cargando histórico')}
}
function mapBybit(i){return ({'1m':'1','5m':'5','15m':'15','30m':'30','1h':'60','4h':'240','1d':'D'})[i]||'15'}
function connect(){
  if(ws){try{ws.close()}catch(e){}}
  history();
  const ex=$('exchange').value;
  if(ex==='binance'){
    ws=new WebSocket(`wss://stream.binance.com:9443/ws/${current.toLowerCase()}@kline_${interval}`);
    ws.onmessage=e=>{const k=JSON.parse(e.data).k;updateLive(+k.t/1000,+k.o,+k.h,+k.l,+k.c,+k.v);};
  }else{
    ws=new WebSocket('wss://stream.bybit.com/v5/public/spot');
    ws.onopen=()=>ws.send(JSON.stringify({op:'subscribe',args:[`kline.${mapBybit(interval)}.${current}`]}));
    ws.onmessage=e=>{const j=JSON.parse(e.data);if(j.topic?.startsWith('kline.')){const k=j.data?.[0];if(k)updateLive(+k.start/1000,+k.open,+k.high,+k.low,+k.close,+k.volume)}};
  }
  ws.onopen=()=>{$('connection').textContent='● conectado';$('connection').className='green'};
  ws.onclose=()=>{$('connection').textContent='● desconectado';$('connection').className='red'};
}
function updateLive(t,o,h,l,c,v){
  candles.update({time:t,open:o,high:h,low:l,close:c});
  volume.update({time:t,value:v,color:c>=o?'#26a69a':'#ef5350'});
  $('price').textContent=c;
  $('market').textContent=current+' · '+interval;
}
function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n)}
function ema(a,n){let out=[],m=2/(n+1),p=null;a.forEach((x,i)=>{p=i===0?x:x*m+p*(1-m);out.push(p)});return out}
function updateIndicators(c){
  if(emaSeries){chart.removeSeries(emaSeries);emaSeries=null}
  if(smaSeries){chart.removeSeries(smaSeries);smaSeries=null}
  const type=$('indicator').value;if(type==='none'||type==='rsi')return;
  const vals=c.map(x=>x.close),arr=type==='ema'?ema(vals,20):sma(vals,20);
  const s=chart.addSeries(LightweightCharts.LineSeries,{lineWidth:2,color:type==='ema'?'#f5c542':'#42a5f5'});
  s.setData(c.map((x,i)=>arr[i]==null?null:{time:x.time,value:arr[i]}).filter(Boolean));
  if(type==='ema')emaSeries=s;else smaSeries=s;
}
$('search').oninput=renderSymbols;$('exchange').onchange=loadSymbols;$('interval').onchange=connect;$('reload').onclick=loadSymbols;
$('indBtn').onclick=()=>$('panel').classList.toggle('show');$('indicator').onchange=()=>history();
window.addEventListener('resize',()=>chart.applyOptions({width:document.getElementById('chart').clientWidth,height:document.getElementById('chart').clientHeight}));
loadSymbols();
</script>
</body></html>
